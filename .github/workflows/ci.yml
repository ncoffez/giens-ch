name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; supersede stale PR checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  FIREBASE_PROJECT: giens-ch
  FIREBASE_TOOLS_VERSION: "15.28.2"

jobs:
  build:
    name: Build${{ github.event_name == 'pull_request' && '' || ' and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Run the fast test suite
        run: npm run test:fast

      # Production deploys must fail loudly on a missing credential rather than
      # shipping a build with an empty runtime config.
      - name: Check required secrets
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_FRONTEND_KEY: ${{ secrets.FIREBASE_FRONTEND_KEY }}
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          DEPLOY_KEY: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [ -n "$FIREBASE_FRONTEND_KEY" ] || missing+=("secret FIREBASE_FRONTEND_KEY")
          [ -n "$FIREBASE_ADMIN_KEY" ] || missing+=("secret FIREBASE_ADMIN_KEY")
          [ -n "$GEMINI_API_KEY" ] || missing+=("secret GEMINI_API_KEY (document extraction, search text and Anleitung translation silently do nothing without it)")
          [ -n "$GH_ISSUES_TOKEN" ] || missing+=("secret GH_ISSUES_TOKEN (error reports answer 503 without it)")

          if [ -z "$DEPLOY_KEY" ] && { [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; }; then
            missing+=("a deploy credential: either vars GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT, or secret FIREBASE_DEPLOY_SERVICE_ACCOUNT")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            for entry in "${missing[@]}"; do
              echo "::error::Missing $entry"
            done
            exit 1
          fi

      # Presence is not enough: a value pasted with quotes, or with the private
      # key's newlines flattened, deploys green and then 500s on every request.
      - name: Validate credential shape
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_FRONTEND_KEY: ${{ secrets.FIREBASE_FRONTEND_KEY }}
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: node scripts/check-runtime-credentials.mjs

      # nuxt.config.ts reads these through runtimeConfig, so they are baked into
      # the bundle at build time — the deployed function has no other source.
      - name: Build
        env:
          FIREBASE_FRONTEND_KEY: ${{ secrets.FIREBASE_FRONTEND_KEY }}
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://giens.ch' }}
          GITHUB_REPO: ${{ vars.GH_REPO || github.repository }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DOCUMENT_TRANSLATION_LANGUAGES: ${{ vars.DOCUMENT_TRANSLATION_LANGUAGES }}
          GITHUB_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
        run: npm run build

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (service account key)
        if: github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2.1.7
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      # firebase-tools compiles firestore.rules whenever that key is present,
      # even for firestore:indexes. The GitHub identity cannot call
      # firebaserules.googleapis.com or firebasestorage.defaultBucket.get.
      # Drop those keys on the runner only; git is unchanged. Ship rules
      # locally with `npm run deploy:rules`.
      - name: Strip security-rules keys from firebase.json
        if: github.event_name != 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (config.firestore) delete config.firestore.rules;
          delete config.storage;
          fs.writeFileSync('firebase.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Deploy to Firebase
        if: github.event_name != 'pull_request'
        run: |
          npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy \
            --project "$FIREBASE_PROJECT" \
            --only firestore:indexes,functions,hosting \
            --non-interactive

      # The only check that proves the runtime credentials actually work: an SSR
      # request goes through the function, which loads the admin key at import.
      - name: Smoke test the deployed site
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://giens.ch' }}
        run: |
          status=000
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o /tmp/smoke.html -w "%{http_code}" --max-time 30 "$SITE_URL/" || echo 000)

            if [ "$status" = "200" ] && grep -q "__nuxt" /tmp/smoke.html; then
              echo "$SITE_URL answered 200 with a rendered page (attempt $attempt)."
              exit 0
            fi

            echo "Attempt $attempt: HTTP $status — retrying in 15s (cold start or propagation)"
            sleep 15
          done

          echo "::error::$SITE_URL did not serve a rendered page after the deploy (last status $status)"
          echo "First 400 bytes of the response:"
          head -c 400 /tmp/smoke.html || true
          exit 1
